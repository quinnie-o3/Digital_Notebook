services:
  - type: web
    name: student-planner-be
    runtime: docker
    rootDir: student-planner-BE/student-planner
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: student-planner
      - key: FRONTEND_ORIGINS
        sync: false
