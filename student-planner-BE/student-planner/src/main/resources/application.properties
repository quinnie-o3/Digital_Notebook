spring.application.name=student-planner
# Cấu hình kết nối Oracle Database
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XE
spring.datasource.username=sys
spring.datasource.password=123456
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Cấu hình Hibernate (JPA)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# Không để JPA tự động tạo/xóa bảng vì bạn đã tự tạo trên Oracle rồi
spring.jpa.hibernate.ddl-auto=none
# Hiển thị câu lệnh SQL trên console để dễ debug
spring.jpa.show-sql=true