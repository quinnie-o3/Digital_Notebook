spring.application.name=student-planner
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.database=${MONGODB_DATABASE:student-planner}
spring.data.mongodb.auto-index-creation=true
app.auth.token-secret=${AUTH_TOKEN_SECRET:student-planner-local-dev-token-secret-change-me}
app.auth.access-token-minutes=${AUTH_ACCESS_TOKEN_MINUTES:30}
app.auth.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:30}
